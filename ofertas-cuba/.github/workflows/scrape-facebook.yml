name: Scrape Facebook groups

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm scrape:facebook
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FB_SCRAPE_USER_AGENT: OfertasCuba/0.1 (+https://ofertascuba.vercel.app)
